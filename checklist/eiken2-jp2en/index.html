var SHEETS = Object.keys(POOL);
var QN = 20, PASS_SCORE = 19;
var stage=document.getElementById('ckStage'), prog=document.getElementById('ckProgress'), tabsEl=document.getElementById('ckTabs');
var cur=0, idx=0, quiz=[], answers=[];
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function sample(arr,n){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a.slice(0,n); }
function shuffle(arr){ return sample(arr, arr.length); }
function boot(){
  tabsEl.innerHTML = SHEETS.map(function(s,i){ return '<button class="ck-tab'+(i===0?' active':'')+'" data-i="'+i+'">単語'+(i+1)+'</button>'; }).join('');
  [].forEach.call(tabsEl.children, function(b){ b.addEventListener('click', function(){ [].forEach.call(tabsEl.children,function(x){x.classList.remove('active');}); b.classList.add('active'); startSheet(parseInt(b.dataset.i,10)); }); });
  startSheet(0);
}
function buildQuiz(sheetKey){
  var p = POOL[sheetKey];
  var chosen = sample(p.hard, Math.min(QN, p.hard.length));   // 難しめのみ
  var allEN = p.hard.map(function(x){return x[0];}).concat(p.easy.map(function(x){return x[0];}));
  return chosen.map(function(pair){
    var w=pair[0], jp=pair[1];             // w=英語(正解), jp=日本語(問題)
    var pool = allEN.filter(function(x){ return x!==w; });
    var opts = shuffle(sample(pool,4).concat([w]));
    return {q:jp, a:w, opts:opts};
  });
}
function startSheet(i){
  cur=i; idx=0; answers=[];
  quiz = buildQuiz(SHEETS[i]);
  prog.style.display='flex'; prog.innerHTML='';
  quiz.forEach(function(){ var s=document.createElement('span'); prog.appendChild(s); });
  renderQ();
}
function updateProgress(){ [].forEach.call(prog.children, function(el,i){ el.className = i<idx?'done':(i===idx?'cur':''); }); }
function renderQ(){
  updateProgress();
  var q=quiz[idx];
  var opts=q.opts.map(function(o){ return '<button class="ck-opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join('');
  stage.innerHTML='<div class="ck-card"><div class="ck-step">単語'+(cur+1)+' ・ '+(idx+1)+' / '+quiz.length+'</div>'+
    '<div class="ck-word">'+esc(q.q)+'</div><div class="ck-opts">'+opts+'</div>'+
    '<button class="ck-back" '+(idx===0?'disabled':'')+'>← 前へ</button></div>';
  [].forEach.call(stage.querySelectorAll('.ck-opt'), function(b){ b.addEventListener('click', function(){ answers[idx]=b.dataset.v; if(idx<quiz.length-1){ idx++; renderQ(); } else { renderResult(); } window.scrollTo({top:0,behavior:'smooth'}); }); });
  var back=stage.querySelector('.ck-back'); back.addEventListener('click', function(){ if(idx>0){ idx--; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); } });
}
function renderResult(){
  [].forEach.call(prog.children, function(el){ el.className='done'; });
  var wrong=[], correct=0;
  quiz.forEach(function(q,i){ if(answers[i]===q.a){ correct++; } else { wrong.push({q:q.q,a:q.a,y:answers[i]||'(未回答)'}); } });
  var passed = correct>=PASS_SCORE;
  var wrongHtml = wrong.length ? '<ul class="ck-wrong">'+wrong.map(function(x){ return '<li><span class="w">'+esc(x.q)+'</span><br>あなたの回答：<span class="yours">'+esc(x.y)+'</span><br>正解：<span class="ans">'+esc(x.a)+'</span></li>'; }).join('')+'</ul>' : '';
  var badge = passed ? '<span class="ck-badge ok">🌱 合格</span>' : '<span class="ck-badge ng">再度トライ</span>';
  var head = passed ? '<div class="ck-score">合格です！（'+correct+' / '+quiz.length+'）</div><p style="color:#4a564d; line-height:1.9;">よくできました。</p>'
                    : '<div class="ck-score">'+correct+' / '+quiz.length+'（合格は '+PASS_SCORE+' 以上）</div><p style="color:#4a564d; line-height:1.9;">間違えた問題と正解はこちらです。もう一度チャレンジしてみましょう。</p>';
  stage.innerHTML='<div class="ck-card ck-result">'+badge+head+wrongHtml+'<div class="ck-actions"><button class="ck-retry" id="ckRetry">もう一度（新しい20問）</button></div></div>';
  document.getElementById('ckRetry').addEventListener('click', function(){ startSheet(cur); window.scrollTo({top:0,behavior:'smooth'}); });
}
